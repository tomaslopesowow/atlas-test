---
- name: Add nodesource signing key
  ansible.builtin.get_url:
    dest: /etc/apt/keyrings/nodesource-repo.gpg.asc
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

- name: Add nodesource 20 repo
  apt_repository:
    repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/nodesource-repo.gpg.asc] https://deb.nodesource.com/node_{{ nodejs_version }} nodistro main
    state: present
    filename: nodejs
    update_cache: yes

- name: Update apt cache
  apt:
    update_cache: yes

- name: Remove existing nodejs
  apt:
    name: nodejs
    state: absent

- name: Install nodejs
  apt:
    name: nodejs
    state: present

- name: Check nodejs version
  command: node -v
  register: node_version
  changed_when: false

- name: Display nodejs version
  debug:
    var: node_version.stdout

- name: Enable corepack
  shell: corepack enable
