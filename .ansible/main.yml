---
- name: Install
  hosts: all
  remote_user: root
  become: yes
  become_method: sudo
  vars_files:
    - vars/main.yml

  pre_tasks:
    - name: Wait for cloud-init to complete
      ansible.builtin.command: cloud-init status --wait
      become: true
      async: 600
      poll: 5

  roles:
    - security
    - docker
    - deploy
