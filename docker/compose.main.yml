services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    deploy:
      mode: replicated
      replicas: 1
    environment:
      - HOST_PROC=/hostfs/proc
      - HOST_SYS=/hostfs/sys
      - HOST_ROOT=/hostfs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      atlas:
    pid: host
    ports:
      - "14317:4317"
      - "14318:4318"
    user: "0:0"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /:/hostfs:ro
      - ./otel/config.yml:/etc/otelcol-contrib/config.yaml:ro

  geoipupdate:
    image: maxmindinc/geoipupdate:latest
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-Country
      - GEOIPUPDATE_FREQUENCY=744
      - GEOIPUPDATE_LICENSE_KEY=${MAXMIND_LICENSE_KEY}
    volumes:
      - geoipdb:/usr/share/GeoIP

  mongo:
    image: mongo:latest
    command:
      - --storageEngine=wiredTiger
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        delay: 5s
        failure_action: rollback
        order: start-first
    networks:
      atlas:
    volumes:
      - mongodb:/data/db

  nginx:
    image: nginx-certbot-geoip
    build:
      dockerfile: nginx.Dockerfile
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        delay: 5s
        failure_action: rollback
        order: start-first
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-infrastructure@owow.io}
      - STAGING=${CERTBOT_STAGING:-0}
    networks:
      atlas:
    ports:
      - 0.0.0.0:80:80
      - 0.0.0.0:443:443
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/000_http.conf:/etc/nginx/user_conf.d/000_http.conf:ro
      - ./nginx/conf.d/100_default.conf:/etc/nginx/user_conf.d/100_default.conf:ro
      - ./nginx/conf.d/main/500_web.conf:/etc/nginx/user_conf.d/500_web.conf:ro
      - geoipdb:/etc/nginx/geoip:ro

  web:
    image: atlas:latest
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        delay: 5s
        failure_action: rollback
        order: start-first
    env_file:
      - ../apps/web/.env.local
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://0.0.0.0:3000/api/health]
    networks:
      atlas:

volumes:
  geoipdb:
  mongodb:
  nginx_secrets:

networks:
  atlas:
    external: false
