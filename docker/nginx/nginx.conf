user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

load_module /etc/nginx/modules/ngx_http_geoip2_module.so;

events {
    worker_connections  1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

    # Shipped to the Observatory hub by the OTel Collector.
    log_format json_access escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"host":"$host",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"country_code":"$geoip2_data_country_code",'
        # The hub counts only navigations; without this every image and XHR is another visitor.
        '"sec_fetch_dest":"$http_sec_fetch_dest"'
    '}';

    # No visitor cookie by design: the hub counts unique people from this log alone, so
    # there is nothing to consent-gate. Do not add `userid`.
    # remote_addr carries that identity, so nginx must stay the real edge: it publishes
    # 80/443 in host mode, and anything put in front of it needs `set_real_ip_from`.

    include /etc/nginx/mime.types;
    include /etc/nginx/conf.d/*.conf;
}
