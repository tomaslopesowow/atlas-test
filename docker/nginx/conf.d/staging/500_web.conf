limit_req_zone $binary_remote_addr zone=otplogin:10m rate=10r/m;

server {
    # listen      80;
    # listen [::]:80;

    listen       443 ssl;
    listen  [::]:443 ssl;

    ssl_certificate         /etc/letsencrypt/live/web/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/web/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/web/chain.pem;

    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    server_name staging.feadship.owow.dev;

    if ($host ~* ^www\.(.+)$) {
        return 301 $scheme://$1$request_uri;
    }

    charset utf-8;

    client_max_body_size 25M;

    add_header Access-Control-Allow-Origin "https://staging.feadship.owow.dev" always;
    add_header Content-Security-Policy "frame-ancestors 'self' staging.feadship.owow.dev" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Country-Code $geoip2_data_country_code;
        proxy_set_header X-Country-Name $geoip2_data_country_name;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_pass http://web:3000;
    }

    location /api/otp/login {
        limit_req zone=otplogin burst=5 nodelay;
        proxy_pass http://web:3000;
    }
}

