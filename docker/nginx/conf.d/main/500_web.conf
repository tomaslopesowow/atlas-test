limit_req_zone $binary_remote_addr zone=otplogin:10m rate=10r/m;

server {
    listen      80;
    listen [::]:80;

    server_name localhost;

    if ($host ~* ^www\.(.+)$) {
        return 301 $scheme://$1$request_uri;
    }

    charset utf-8;

    client_max_body_size 10M;

    add_header Access-Control-Allow-Origin "http://localhost" always;
    add_header Content-Security-Policy "frame-ancestors 'self' localhost" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always; # Disabled for HTTP
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        # OpenTelemetry tracing
        otel_trace on;
        otel_trace_context propagate;
        otel_span_name "$request_method $uri";

        proxy_cache_bypass $http_upgrade;

        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-IP $remote_addr;
        # GeoIP headers disabled for local testing
        # proxy_set_header X-Country-Code $geoip2_data_country_code;
        # proxy_set_header X-Country-Name $geoip2_data_country_name;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_pass http://web:3000;
    }

    location /api/otp/login {
        # OpenTelemetry tracing
        otel_trace on;
        otel_trace_context propagate;
        otel_span_name "$request_method $uri";

        limit_req zone=otplogin burst=5 nodelay;
        proxy_pass http://web:3000;
    }
}
