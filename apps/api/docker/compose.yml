services:
  postgres:
    image: postgres:18-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres:/var/lib/postgresql

  # catches every mail the api sends; read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres:
