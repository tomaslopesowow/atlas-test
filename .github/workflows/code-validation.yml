name: Code Validation
on:
  pull_request: {}
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/workflows/pnpm-install
    - run: pnpm lint
  Compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/workflows/pnpm-install
    - run: pnpm typecheck
