name: Code Validation

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/workflows/pnpm-install

    - name: Lint
      run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/workflows/pnpm-install

    - name: Typecheck
      run: pnpm typecheck

