name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: environment
      version:
        description: 'Version tag to deploy (e.g., v1.2.3)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  TF_INPUT: false
  TF_ACTIONS_WORKING_DIR: ".terraform/${{ inputs.environment }}"
  ANSIBLE_WORKING_DIR: ".ansible"

jobs:
  terraform:
    name: Deploy Infra
    runs-on: ubuntu-latest
    outputs:
      terraform_output: ${{ steps.output.outputs.stdout }}

    environment:
      name: ${{ inputs.environment }}

    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      TF_VAR_SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    defaults:
      run:
        working-directory: ${{ env.TF_ACTIONS_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: opentofu/setup-opentofu@v2

      - name: Terraform Init
        run: tofu init
        id: init

      - name: Terraform Apply
        run: tofu apply -auto-approve
        id: apply

      - name: Terraform Output
        run: tofu output -json
        id: output

  ansible:
    name: Deploy App
    runs-on: ubuntu-latest

    needs:
      - terraform

    environment:
      name: ${{ inputs.environment }}

    permissions: read-all

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create Ansible Inventory
        uses: actions/github-script@v9
        id: inventory
        env:
          TF_OUTPUT: ${{ needs.terraform.outputs.terraform_output }}
        with:
          script: |
            const { server_ip } = JSON.parse(process.env.TF_OUTPUT);

            return `${ server_ip.value },`; // Inline hosts must end with a comma
          result-encoding: string

      - name: Make SSH directory
        run: mkdir -p ~/.ssh

      - name: Add private key
        run: echo -e "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ansible

      - name: Set permissions
        run: chmod 600 ~/.ssh/ansible

      - name: Wait for server to be ready
        run: |
          SERVER_IP="${{ steps.inventory.outputs.result }}"
          SERVER_IP="${SERVER_IP%,}"

          echo "Waiting for server $SERVER_IP to be ready..."
          for i in {1..30}; do
            if ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i ~/.ssh/ansible root@$SERVER_IP "echo 'Server ready'" 2>/dev/null; then
              echo "Server is ready!"
              break
            fi
            echo "Attempt $i/30: Server not ready, waiting 30 seconds..."
            sleep 30
          done

          if [ $i -eq 30 ]; then
            echo "Server failed to become ready after 15 minutes"
            exit 1
          fi

      - name: Scan SSH host key
        run: ssh-keyscan -t rsa,ed25519 ${{ steps.inventory.outputs.result }} >> ~/.ssh/known_hosts

      - name: Ansible Playbook
        working-directory: ${{ env.ANSIBLE_WORKING_DIR }}
        run: |
          # Encode the secret to base64
          ENCODED_ENV=$(echo '${{ secrets.WEB_ENV }}' | base64 -w 0)

          ansible-playbook --private-key ~/.ssh/ansible -i ${{ steps.inventory.outputs.result }} main.yml \
          --extra-vars '{
            "atlas_environment": "${{ inputs.environment }}",
            "atlas_web_env": "'$ENCODED_ENV'",
            "atlas_web_version": "${{ inputs.version }}",
            "digitalocean_token": "${{ secrets.DIGITALOCEAN_TOKEN }}",
            "maxmind_account_id": "${{ vars.MAXMIND_ACCOUNT_ID }}",
            "maxmind_license_key": "${{ secrets.MAXMIND_LICENSE_KEY }}",
            "mongo_root_username": "${{ secrets.MONGO_ROOT_USERNAME }}",
            "mongo_root_password": "${{ secrets.MONGO_ROOT_PASSWORD }}"
          }'
