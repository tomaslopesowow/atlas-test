name: Plan Infrastructure

on:
  pull_request:
    branches: ["NON_EXISTENT_BRANCH_SO_THIS_WORKFLOW_WONT_RUN"] # replace as needed ["main", "develop"]
  workflow_dispatch:

env:
  TF_INPUT: false
  TF_ACTIONS_WORKING_DIR: ".terraform/${{ github.event.pull_request.base.ref }}"

jobs:
  terraform:
    name: Plan Infrastructure
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.pull_request.base.ref }}

    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      TF_VAR_SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    defaults:
      run:
        working-directory: ${{ env.TF_ACTIONS_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v2

      - name: Terraform Format
        run: tofu fmt -check
        id: fmt
        continue-on-error: true

      - name: Terraform Init
        run: tofu init
        id: init

      - name: Terraform Validate
        run: tofu validate -no-color
        id: validate

      - name: Terraform Plan
        run: tofu plan -no-color
        id: plan
        continue-on-error: true

      - name: Terraform Plan Comment
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request'
        env:
          VALIDATION: "${{ steps.validate.outputs.stdout }}"
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            // Retrieve existing bot comments for the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes('<!-- TERRAFORM OUTPUT -->'))

            // Prepare format of the comment
            const output = `<!-- TERRAFORM OUTPUT -->
            #### OpenTofu Format and Style 🖌️ \`${{ steps.fmt.outcome }}\`
            #### OpenTofu Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### OpenTofu Validation 🤖 \`${{ steps.validate.outcome }}\`
            <details>
              <summary>Validation Output</summary>

              \`\`\`
              ${ process.env.VALIDATION.trim() }
              \`\`\`
            </details>

            #### OpenTofu Plan 📖 \`${{ steps.plan.outcome }}\`
            <details open>
              <summary>Plan Output</summary>

              \`\`\`
              ${ process.env.PLAN.trim() }
              \`\`\`
            </details>

            *Pusher: ${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ env.TF_ACTIONS_WORKING_DIR }}\`, Workflow: \`${{ github.workflow }}\`*`;

            // If we have a comment, update it, otherwise create a new one
            const commentData = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            };

            if (botComment) {
              github.rest.issues.updateComment({
                comment_id: botComment.id,
                ...commentData,
              })

              return;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              ...commentData,
            })
