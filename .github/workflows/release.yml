name: Release

on:
  push:
    branches: ["NON_EXISTENT_BRANCH_SO_THIS_WORKFLOW_WONT_RUN"] # replace as needed ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  semantic-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      released: ${{ steps.semantic.outputs.new_release_published }}
      environment: ${{ steps.extract-environment.outputs.result }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract environment from release name
        uses: actions/github-script@v9
        id: extract-environment
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          NEW_RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
        with:
          result-encoding: string
          script: |
            const release = process.env.NEW_RELEASE_VERSION;

            console.log('Trying to extract environment from new release version: ' + release);

            if (!/^[0-9]+\.[0-9]+\.[0-9]+(\-[a-z]+\.[0-9]+)?$/.test(release)) {
              throw 'Release name does not follow the release pattern';
            }

            const result = release.match(/[0-9]\-(.*?)\.[0-9]/);

            console.log('Detected environemnt: ' + result);

            if (result === null) {
              return 'main';
            }

            if (result.length < 2) {
              throw 'Could not exract environment from release name.';
            }

            return result[1];

  docker:
    name: Build n Push
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'

    strategy:
      matrix:
        include:
          - image: web
            dockerfile: docker/web.Dockerfile

    environment:
      name: ${{ needs.semantic-release.outputs.environment }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Copy env file
        run: cp apps/web/.env.${{ needs.semantic-release.outputs.environment }} apps/web/.env.local

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            registry.digitalocean.com/owow/BOOTSTRAP_PROJECT_NAME-${{ matrix.image }}:${{ github.sha }}
            registry.digitalocean.com/owow/BOOTSTRAP_PROJECT_NAME-${{ matrix.image }}:v${{ needs.semantic-release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  trigger-deploy:
    name: Trigger Deploy
    runs-on: ubuntu-latest
    needs:
      - semantic-release
      - docker
    if: needs.semantic-release.outputs.released == 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trigger Deploy Workflow
        run: |
          gh workflow run deploy.yml \
            --ref v${{ needs.semantic-release.outputs.version }} \
            --raw-field environment=${{ needs.semantic-release.outputs.environment }} \
            --raw-field version=v${{ needs.semantic-release.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
