name: Provision Infrastructure + Configure Server

on:
  push:
    branches: ["NON_EXISTENT_BRANCH_SO_THIS_WORKFLOW_WONT_RUN"] # replace as needed ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  TF_INPUT: false
  TF_ACTIONS_WORKING_DIR: ".terraform/${{ github.ref_name }}"
  ANSIBLE_WORKING_DIR: ".ansible"

jobs:
  terraform:
    name: Provision Infrastructure
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name }}

    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      TF_VAR_SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    defaults:
      run:
        working-directory: ${{ env.TF_ACTIONS_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1

      - name: Terraform Init
        run: tofu init
        id: init

      - name: Terraform Apply
        run: tofu apply -auto-approve
        id: apply

  ansible:
    name: Configure Server
    runs-on: ubuntu-latest

    needs: terraform

    environment:
      name: ${{ github.ref_name }}

    permissions: read-all

    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      TF_VAR_SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: Terraform Init
        working-directory: ${{ env.TF_ACTIONS_WORKING_DIR }}
        run: tofu init
        id: init

      - name: Terraform Output
        working-directory: ${{ env.TF_ACTIONS_WORKING_DIR }}
        run: tofu output -json
        id: output

      - name: Create Ansible Inventory
        uses: actions/github-script@v7
        id: inventory
        env:
          TF_OUTPUT: ${{ steps.output.outputs.stdout }}
        with:
          script: |
            const { server_ip } = JSON.parse(process.env.TF_OUTPUT);

            return `${ server_ip.value },`; // Inline hosts must end with a comma
          result-encoding: string

      - name: Add private SSH key
        run: |
          mkdir -p ~/.ssh
          echo -e "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ansible
          chmod 600 ~/.ssh/ansible
          ssh-keyscan -t rsa,ed25519 ${{ steps.inventory.outputs.result }} >> ~/.ssh/known_hosts

      - name: Install dependencies
        run: pnpm install
  
      - name: Build Application
        run: |
          echo '${{ secrets.ENV_WEB }}' > apps/web/.env
          rm -rf apps/web/app/\(frontend\)/cosmos
          pnpm dotenv -- pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Ansible Playbook
        working-directory: ${{ env.ANSIBLE_WORKING_DIR }}
        run: |
          ansible-playbook --private-key ~/.ssh/ansible -i ${{ steps.inventory.outputs.result }} main.yml \
          --extra-vars '{
            "apps": ${{ vars.APPS }},
            "github_token": "${{ secrets.GITHUB_TOKEN }}",
            "git_branch": "${{ github.ref_name }}"
          }'
